# wowacool Worker. Entry: src/cloudflare/worker.ts
# GET / serves the operations workbench. GET /health stays JSON.
# The local CLI does not need this file.
# Do not put Cloudflare account IDs or API tokens in this file.
# CI reads CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN from GitHub Actions secrets.

name = "wowacool"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-11-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

# Non-secret defaults. Set OPENROUTER_API_KEY with `npx wrangler secret put`
# after the account is connected. Never commit secret values.
[vars]
# workers_ai uses the AI binding below. Set mock to force placeholders.
# openai_compatible stays available when IMAGE_GEN_* secrets are set.
IMAGE_PROVIDER = "workers_ai"
PHASE = "2"
# Non-secret routing hint. The live catalog still decides which free text models exist.
OPENROUTER_PREFERRED_MODEL = "liquid/lfm-3-1.7b:free"
# Official still-image model. FLUX.2 [klein] 4B accepts width and height.
# Not Seedance (video) and not a Grok / xAI image API.
WORKERS_AI_IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"

# Same Cloudflare account. No extra vendor key. Do not put an account id here.
[ai]
binding = "AI"

# Optional Worker secrets, set with `npx wrangler secret put`, never committed:
#   OPENROUTER_API_KEY   free-text copy generation
#   APP_ACCESS_TOKEN      optional gate for the public workers.dev URL
#   DATA_SOURCE_TOKEN     required for assistant writes to topic data sources
# If APP_ACCESS_TOKEN is unset, the workbench stays open so it can be demoed after deploy.
# Ingest still requires DATA_SOURCE_TOKEN. Do not commit that value.

[observability]
enabled = true

  [observability.logs]
  enabled = true
  head_sampling_rate = 1

  [observability.traces]
  enabled = true
  # Ops traffic is low; keep full traces until the workbench is busy.
  head_sampling_rate = 1

# Resource ids only. Never put an account id or API token in this file.
# Queues stay unused: job steps run inside the request.

[[d1_databases]]
binding = "DB"
database_name = "wowacool"
database_id = "9cebe552-537a-4268-bc12-5c046e2cd88a"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wowacool-assets"

